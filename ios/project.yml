name: LayerX
options:
  bundleIdPrefix: world.layerx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LayerX:
    type: application
    platform: iOS
    sources:
      - path: LayerX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.layerx.app
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LayerX/Info.plist
      properties:
        NSCameraUsageDescription: "Layer X uses the camera to place digital objects on real surfaces."
        NSLocationWhenInUseUsageDescription: "Layer X uses your location to place and discover digital layers nearby."
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
