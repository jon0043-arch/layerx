name: LayerX
options:
  bundleIdPrefix: world.layerx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LayerX:
    type: application
    platform: iOS
    sources:
      - path: LayerX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.layerx.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Layer X uses your camera to place and discover digital layers in the real world."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Layer X uses your approximate location to show nearby layers and save where you leave one."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: "arkit"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
